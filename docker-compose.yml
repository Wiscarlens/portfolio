services:
  web:
    build:
      context: .
      args:
        # Build-time, not runtime. Change either value and you must rebuild.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://wiscarlens.com}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    image: wiscarlens-portfolio
    container_name: wiscarlens-portfolio
    restart: unless-stopped
    # Runtime secrets. Unlike the build args above, these are read on each
    # request, so changing one needs a restart rather than a rebuild.
    environment:
      CONTACT_DISCORD_WEBHOOK_URL: ${CONTACT_DISCORD_WEBHOOK_URL:-}
    ports:
      - '3000:3000'
